<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>My Dashboard</title>
<style>
  /* ============================================================
     CSS VARIABLES & RESET
  ============================================================ */
  :root {
    --bg: #050506;
    --text-primary: #FAFAFA;
    --text-secondary: #B8B6B0;
    --text-tertiary: #76746E;
    --success: #6BE3A4;
    --warning: #F2C063;
    --danger: #FF6B6B;
    --card-bg: rgba(255, 255, 255, 0.04);
    --card-border: rgba(255, 255, 255, 0.06);
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --shadow-card: 0 12px 40px rgba(0, 0, 0, 0.45);
    --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  /* ============================================================
     BODY & BACKGROUND
  ============================================================ */
  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  body::before {
    content: "";
    position: fixed;
    inset: -10%;
    background:
      radial-gradient(circle at 82% 14%, rgba(224,118,88,0.16), transparent 40%),
      radial-gradient(circle at 18% 90%, rgba(180,180,200,0.06), transparent 45%);
    filter: blur(40px);
    z-index: -2;
    pointer-events: none;
    animation: drift 36s ease-in-out infinite alternate;
  }
  @keyframes drift {
    0%   { transform: translate3d(0,0,0) scale(1); }
    50%  { transform: translate3d(2%,-1.5%,0) scale(1.04); }
    100% { transform: translate3d(-1.5%,2%,0) scale(1.02); }
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='3' height='3'><rect x='0' y='0' width='1' height='1' fill='white' fill-opacity='0.014'/></svg>");
    background-size: 3px 3px;
    z-index: -1;
    pointer-events: none;
    mix-blend-mode: screen;
  }

  /* ============================================================
     LAYOUT
  ============================================================ */
  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px;
  }
  header.container { padding-bottom: 8px; }
  h1.page-title {
    margin: 0;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(180deg, #FFFFFF 0%, #B8B6B0 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  main.container {
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding-top: 20px;
    padding-bottom: 120px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    padding: 20px;
    backdrop-filter: blur(24px) saturate(1.2);
    -webkit-backdrop-filter: blur(24px) saturate(1.2);
    box-shadow: var(--shadow-card);
  }
  main.container > section:empty {
    background: var(--card-bg);
    border: 1px dashed var(--card-border);
    border-radius: var(--radius-lg);
    min-height: 64px;
    opacity: 0.45;
  }
  #settings-gear {
    position: fixed;
    top: 18px;
    right: 18px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    color: var(--text-secondary);
    font-size: 16px;
    cursor: pointer;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: transform 0.15s ease, color 0.15s ease, background 0.15s ease;
    z-index: 10;
  }
  #settings-gear:hover {
    color: var(--text-primary);
    transform: translateY(-1px) rotate(20deg);
    background: rgba(255,255,255,0.08);
  }
  #chat-toggle {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 12px 18px;
    border-radius: 999px;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    color: var(--text-secondary);
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: var(--shadow-card);
    z-index: 10;
    opacity: 0.6;
  }
  #chat-panel { display: none; }
  #modal-root { position: relative; z-index: 100; }

  /* ============================================================
     GOAL TICKER
  ============================================================ */
  .ticker-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-md);
    padding: 10px 16px;
    overflow: hidden;
    backdrop-filter: blur(24px) saturate(1.2);
    -webkit-backdrop-filter: blur(24px) saturate(1.2);
    box-shadow: var(--shadow-card);
  }
  .ticker-led {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--success);
    flex-shrink: 0;
    animation: led-pulse 2s ease-in-out infinite;
  }
  @keyframes led-pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(107,227,164,0.5); }
    50%      { box-shadow: 0 0 0 5px rgba(107,227,164,0); }
  }
  .ticker-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--text-tertiary);
    flex-shrink: 0;
  }
  .ticker-viewport {
    flex: 1;
    overflow: hidden;
    height: 22px;
    position: relative;
  }
  .ticker-item {
    position: absolute;
    inset: 0;
    font-size: 14px;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    animation: ticker-in 0.4s ease;
  }
  .ticker-item.out {
    animation: ticker-out 0.35s ease forwards;
  }
  @keyframes ticker-in {
    from { transform: translateY(110%); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }
  @keyframes ticker-out {
    from { transform: translateY(0);     opacity: 1; }
    to   { transform: translateY(-110%); opacity: 0; }
  }
  .ticker-pill {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(255,255,255,0.06);
    color: var(--text-secondary);
    flex-shrink: 0;
  }

  /* ============================================================
     DAY RING
  ============================================================ */
  .ring-card {
    display: flex;
    align-items: center;
    gap: 28px;
  }
  .ring-svg-wrap {
    position: relative;
    flex-shrink: 0;
    width: 160px;
    height: 160px;
  }
  .ring-svg-wrap svg { transform: rotate(-90deg); }
  .ring-bg-circle {
    fill: none;
    stroke: rgba(255,255,255,0.06);
    stroke-width: 10;
  }
  .ring-fg-circle {
    fill: none;
    stroke-width: 10;
    stroke-linecap: round;
    transition: stroke-dashoffset 1.2s ease, stroke 0.8s ease;
  }
  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }
  .ring-pct {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1;
    color: var(--text-primary);
  }
  .ring-phase-label {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.1em;
    color: var(--text-tertiary);
  }
  .ring-clock {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 2px;
  }
  .ring-info {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .ring-status {
    font-size: 15px;
    color: var(--text-primary);
    font-weight: 500;
  }
  .ring-remaining {
    font-size: 13px;
    color: var(--text-secondary);
  }
  .ring-hours {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-tertiary);
  }

  /* ============================================================
     TO DO LIST (TODAY + TOMORROW)
  ============================================================ */
  .todo-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .todo-eyebrow {
    font-size: 11px;
    font-family: var(--font-mono);
    letter-spacing: 0.08em;
    color: var(--text-tertiary);
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  .todo-big-progress {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1;
    color: var(--text-primary);
  }
  .todo-big-progress .todo-total {
    color: var(--text-tertiary);
    font-size: 22px;
  }
  .todo-done-label {
    font-size: 12px;
    color: var(--success);
    margin-top: 2px;
    min-height: 18px;
  }
  .streak-pill {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px 12px;
    border-radius: 999px;
    background: rgba(242,192,99,0.1);
    border: 1px solid rgba(242,192,99,0.2);
    font-size: 13px;
    color: var(--warning);
    font-weight: 600;
    align-self: flex-start;
  }
  .streak-pill.zero { opacity: 0.4; background: rgba(255,255,255,0.04); border-color: transparent; color: var(--text-tertiary); }

  /* Segmented progress bar */
  .progress-bar {
    display: flex;
    gap: 3px;
    margin-bottom: 16px;
    height: 4px;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-seg {
    flex: 1;
    border-radius: 2px;
    background: rgba(255,255,255,0.08);
    transition: background 0.3s ease;
  }
  .progress-seg.done { background: var(--success); }

  /* Goal rows */
  .goal-list { display: flex; flex-direction: column; gap: 2px; margin-bottom: 12px; }
  .goal-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    background: transparent;
    transition: background 0.15s ease, opacity 0.2s ease;
    cursor: grab;
    position: relative;
    border-left: 2px solid transparent;
    user-select: none;
  }
  .goal-row:hover { background: rgba(255,255,255,0.04); }
  .goal-row.dragging { opacity: 0.4; }
  .goal-row.drag-over { background: rgba(255,255,255,0.07); }
  .goal-row.is-done {
    opacity: 0.45;
  }
  .goal-row.is-queued {
    background: rgba(242,192,99,0.05);
    border-left-color: var(--warning);
  }
  .goal-row.is-done .goal-text { text-decoration: line-through; color: var(--text-tertiary); }

  .goal-check {
    width: 18px;
    height: 18px;
    border-radius: 5px;
    border: 1.5px solid rgba(255,255,255,0.2);
    background: transparent;
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .goal-check:hover { border-color: var(--success); }
  .goal-check.checked {
    background: rgba(107,227,164,0.15);
    border-color: var(--success);
  }
  .goal-check.checked::after {
    content: "";
    display: block;
    width: 5px;
    height: 9px;
    border: 1.5px solid var(--success);
    border-top: none;
    border-left: none;
    transform: rotate(45deg) translate(-1px, -1px);
  }
  .goal-text-wrap { flex: 1; min-width: 0; }
  .goal-text {
    font-size: 14px;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: text;
  }
  .goal-text-input {
    font-family: inherit;
    font-size: 14px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 4px;
    color: var(--text-primary);
    padding: 1px 6px;
    width: 100%;
    outline: none;
  }
  .goal-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .goal-row:hover .goal-actions { opacity: 1; }
  .goal-btn {
    background: none;
    border: none;
    color: var(--text-tertiary);
    cursor: pointer;
    padding: 2px 5px;
    border-radius: 4px;
    font-size: 13px;
    line-height: 1;
    transition: color 0.15s, background 0.15s;
  }
  .goal-btn:hover { color: var(--text-primary); background: rgba(255,255,255,0.08); }
  .goal-btn.queue-btn:hover { color: var(--warning); }
  .goal-btn.del-btn:hover { color: var(--danger); }

  .show-more-btn {
    background: none;
    border: none;
    color: var(--text-tertiary);
    cursor: pointer;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    transition: color 0.15s, background 0.15s;
    width: 100%;
    text-align: center;
    margin-bottom: 10px;
  }
  .show-more-btn:hover { color: var(--text-secondary); background: rgba(255,255,255,0.04); }

  .todo-add-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 4px;
  }
  .todo-add-input {
    flex: 1;
    font-family: inherit;
    font-size: 14px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    padding: 8px 12px;
    outline: none;
    transition: border-color 0.15s;
  }
  .todo-add-input::placeholder { color: var(--text-tertiary); }
  .todo-add-input:focus { border-color: rgba(255,255,255,0.2); }
  .todo-add-btn {
    font-family: inherit;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--card-border);
    background: rgba(255,255,255,0.06);
    color: var(--text-secondary);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
  }
  .todo-add-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-primary); }
  .todo-add-btn.polish { color: var(--warning); border-color: rgba(242,192,99,0.2); }

  .push-btn {
    font-family: inherit;
    font-size: 12px;
    background: none;
    border: none;
    color: var(--text-tertiary);
    cursor: pointer;
    padding: 6px 10px;
    border-radius: var(--radius-sm);
    transition: color 0.15s, background 0.15s;
    margin-top: 8px;
  }
  .push-btn:hover { color: var(--text-secondary); background: rgba(255,255,255,0.04); }

  .todo-section-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--text-tertiary);
    text-transform: uppercase;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .planned-badge {
    padding: 2px 7px;
    border-radius: 999px;
    background: rgba(255,255,255,0.06);
    color: var(--text-tertiary);
    font-size: 10px;
  }

  /* ============================================================
     RESPONSIVE
  ============================================================ */
  @media (max-width: 600px) {
    .container { padding: 24px 16px; }
    h1.page-title { font-size: 24px; }
    main.container { gap: 16px; padding-bottom: 100px; }
    .card { padding: 16px; }
    #settings-gear { top: 12px; right: 12px; }
    #chat-toggle { bottom: 14px; right: 14px; }
    .ring-card { flex-direction: column; align-items: flex-start; }
    .ring-svg-wrap { width: 140px; height: 140px; }
    .ticker-label { display: none; }
    .choice-grid { grid-template-columns: repeat(2, 1fr); }
    .choice-grid.cols-3 { grid-template-columns: repeat(2, 1fr); }
    .emoji-row { gap: 5px; }
    .emoji-btn { font-size: 20px; padding: 10px 2px; }
    .modal-card { padding: 24px 20px; border-radius: 16px; }
    .modal-question { font-size: 18px; }
  }

  /* ============================================================
     MODAL SYSTEM (onboarding + morning check-in)
  ============================================================ */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5,5,6,0.88);
    backdrop-filter: blur(16px) saturate(1.5);
    -webkit-backdrop-filter: blur(16px) saturate(1.5);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: modal-fade-in 0.3s ease;
  }
  @keyframes modal-fade-in { from { opacity: 0; } to { opacity: 1; } }
  .modal-card {
    background: rgba(16,16,20,0.97);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 36px;
    max-width: 500px;
    width: 100%;
    box-shadow: 0 24px 80px rgba(0,0,0,0.65);
  }
  .modal-dots { display: flex; gap: 6px; margin-bottom: 28px; }
  .modal-dot {
    height: 6px;
    border-radius: 3px;
    background: rgba(255,255,255,0.12);
    transition: background 0.3s, width 0.3s;
    width: 6px;
  }
  .modal-dot.active { background: var(--text-primary); width: 20px; }
  .modal-dot.done  { background: var(--success); width: 6px; }
  .modal-question {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text-primary);
    margin: 0 0 8px;
    line-height: 1.2;
  }
  .modal-sub { font-size: 14px; color: var(--text-tertiary); margin: 0 0 20px; }
  .choice-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin-bottom: 24px; }
  .choice-grid.cols-3 { grid-template-columns: repeat(3,1fr); }
  .choice-card {
    background: rgba(255,255,255,0.04);
    border: 1.5px solid rgba(255,255,255,0.07);
    border-radius: var(--radius-md);
    padding: 14px 10px;
    cursor: pointer;
    text-align: center;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .choice-card:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.15); transform: translateY(-1px); }
  .choice-card.selected { background: rgba(107,227,164,0.08); border-color: var(--success); }
  .choice-icon { font-size: 22px; line-height: 1; }
  .choice-label { font-size: 12px; color: var(--text-secondary); font-weight: 500; line-height: 1.3; }
  .choice-card.selected .choice-label { color: var(--success); }
  .emoji-row { display: flex; gap: 8px; margin-bottom: 24px; }
  .emoji-btn {
    flex: 1;
    background: rgba(255,255,255,0.04);
    border: 1.5px solid rgba(255,255,255,0.07);
    border-radius: var(--radius-sm);
    padding: 12px 4px;
    cursor: pointer;
    font-size: 24px;
    line-height: 1;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .emoji-btn:hover { transform: scale(1.1); border-color: rgba(255,255,255,0.15); }
  .emoji-btn.selected { border-color: var(--success); background: rgba(107,227,164,0.08); }
  .modal-text-input {
    font-family: inherit; font-size: 15px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    border-radius: var(--radius-sm); color: var(--text-primary);
    padding: 12px 16px; width: 100%; outline: none; margin-bottom: 24px;
    transition: border-color 0.15s;
  }
  .modal-text-input::placeholder { color: var(--text-tertiary); }
  .modal-text-input:focus { border-color: rgba(255,255,255,0.25); }
  .modal-nav { display: flex; gap: 10px; justify-content: flex-end; align-items: center; }
  .modal-btn {
    font-family: inherit; font-size: 14px; font-weight: 500;
    padding: 10px 22px; border-radius: 999px; border: 1px solid transparent;
    cursor: pointer; transition: background 0.15s, color 0.15s, transform 0.1s;
  }
  .modal-btn:active { transform: scale(0.97); }
  .modal-btn.primary { background: var(--text-primary); color: var(--bg); }
  .modal-btn.primary:hover { background: #e0e0e0; }
  .modal-btn.primary:disabled { opacity: 0.35; cursor: default; transform: none; }
  .modal-btn.secondary { background: transparent; color: var(--text-tertiary); border-color: rgba(255,255,255,0.08); }
  .modal-btn.secondary:hover { color: var(--text-secondary); background: rgba(255,255,255,0.04); }
  .modal-welcome { text-align: center; padding: 8px 0; }
  .modal-welcome-name {
    font-size: 28px; font-weight: 700; margin-bottom: 8px;
    background: linear-gradient(135deg, var(--success), var(--warning));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .modal-welcome-focus { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; }
  .modal-welcome-quote {
    font-size: 15px; color: var(--text-primary); font-style: italic;
    line-height: 1.6; margin-bottom: 28px; opacity: 0.85;
  }
  .modal-morning-msg {
    background: rgba(107,227,164,0.06);
    border: 1px solid rgba(107,227,164,0.15);
    border-radius: var(--radius-md);
    padding: 16px; font-size: 14px; color: var(--text-secondary);

<body>
  <header class="container">
    <h1 class="page-title">My Dashboard</h1>
  </header>

  <main class="container">
    <section id="goal-ticker"></section>
    <section id="day-ring"></section>
    <section id="ai-coaching-banner"></section>
    <section id="todo-today"></section>
    <section id="todo-tomorrow"></section>
    <section id="time-log"></section>
    <section id="fitness"></section>
    <section id="mental-health"></section>
  </main>

  <button id="chat-toggle" type="button" aria-label="Open coach">💬 Coach</button>
  <aside id="chat-panel" aria-hidden="true"></aside>
  <button id="settings-gear" type="button" aria-label="Settings">⚙</button>
  <div id="modal-root"></div>

<script>
(function () {
  "use strict";

  const App = window.App = {};

  /* ============================================================
     PHASE 1 — INFRASTRUCTURE
  ============================================================ */

  App.config = {
    ANTHROPIC_API_KEY: 'PASTE_YOUR_KEY_HERE',
    MODEL_FAST: 'claude-haiku-4-5',
    MODEL_DEEP: 'claude-sonnet-4-5',
    DAY_BOUNDARY_HOUR: 6,
  };
  App.config.hasApiKey = function () {
    const k = App.config.ANTHROPIC_API_KEY;
    return typeof k === 'string' && k.length > 0 && k !== 'PASTE_YOUR_KEY_HERE';
  };

  App.storage = {
    get(key, defaultValue) {
      try {
        const raw = localStorage.getItem(key);
        if (raw === null) return defaultValue;
        return JSON.parse(raw);
      } catch (e) { return defaultValue; }
    },
    set(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); return true; }
      catch (e) { return false; }
    },
    remove(key) { try { localStorage.removeItem(key); } catch (e) {} },
    clearAll() { try { localStorage.clear(); } catch (e) {} },
  };

  App.dates = {
    formatYMD(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    },
    today(now) { return App.dates.formatYMD(now || new Date()); },
    activeDate(now) {
      const d = new Date(now || new Date());
      if (d.getHours() < App.config.DAY_BOUNDARY_HOUR) d.setDate(d.getDate() - 1);
      return App.dates.formatYMD(d);
    },
    daysBetween(a, b) {
      const da = new Date(a + 'T00:00:00');
      const db = new Date(b + 'T00:00:00');
      return Math.round((db - da) / 86400000);
    },
    addDays(ymd, n) {
      const d = new Date(ymd + 'T00:00:00');
      d.setDate(d.getDate() + n);
      return App.dates.formatYMD(d);
    },
  };

  App.bus = (function () {
    const handlers = new Map();
    return {
      on(name, fn) {
        if (!handlers.has(name)) handlers.set(name, new Set());
        handlers.get(name).add(fn);
      },
      off(name, fn) { const s = handlers.get(name); if (s) s.delete(fn); },
      emit(name, payload) {
        const s = handlers.get(name);
        if (!s) return;
        for (const fn of s) { try { fn(payload); } catch (e) {} }
      },
    };
  })();

  App.initFns = [];
  App.registerInit = function (fn) { App.initFns.push(fn); };

  /* ============================================================
     PHASE 2 — GOALS DATA LAYER
  ============================================================ */

  App.goals = {
    key(date) { return `goals:${date}`; },

    get(date) { return App.storage.get(App.goals.key(date), []); },

    set(date, list) {
      App.storage.set(App.goals.key(date), list);
      App.bus.emit('goals-changed', { date });
    },

    add(date, text) {
      text = text.trim();
      if (!text) return;
      const list = App.goals.get(date);
      list.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2), text, done: false, queued: false });
      App.goals.set(date, list);
    },

    toggle(date, id) {
      const list = App.goals.get(date);
      const g = list.find(x => x.id === id);
      if (!g) return;
      g.done = !g.done;
      g.doneAt = g.done ? Date.now() : undefined;
      App.goals.set(date, list);
      App.streak.processDay(date);
    },

    delete(date, id) {
      App.goals.set(date, App.goals.get(date).filter(x => x.id !== id));
    },

    updateText(date, id, text) {
      text = text.trim();
      if (!text) return;
      const list = App.goals.get(date);
      const g = list.find(x => x.id === id);
      if (g) { g.text = text; App.goals.set(date, list); }
    },

    toggleQueue(date, id) {
      const list = App.goals.get(date);
      const g = list.find(x => x.id === id);
      if (g) { g.queued = !g.queued; App.goals.set(date, list); }
    },

    reorder(date, fromIdx, toIdx) {
      const list = App.goals.get(date);
      if (fromIdx === toIdx) return;
      const [item] = list.splice(fromIdx, 1);
      list.splice(toIdx, 0, item);
      App.goals.set(date, list);
    },

    pushRemaining(fromDate, toDate) {
      const incomplete = App.goals.get(fromDate).filter(g => !g.done);
      if (!incomplete.length) return;
      const existing = App.goals.get(toDate);
      const existingTexts = new Set(existing.map(g => g.text.toLowerCase()));
      const toAdd = incomplete.filter(g => !existingTexts.has(g.text.toLowerCase()));
      toAdd.forEach(g => {
        existing.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2), text: g.text, done: false, queued: false });
      });
      App.goals.set(toDate, existing);
    },

    rollover() {
      const active = App.dates.activeDate();
      // Scan past 30 days for incomplete goals, push to today
      for (let i = 1; i <= 30; i++) {
        const past = App.dates.addDays(active, -i);
        const pastGoals = App.goals.get(past);
        if (!pastGoals.length) continue;
        const incomplete = pastGoals.filter(g => !g.done);
        if (!incomplete.length) continue;
        const existing = App.goals.get(active);
        const existingTexts = new Set(existing.map(g => g.text.toLowerCase()));
        let added = false;
        incomplete.forEach(g => {
          if (!existingTexts.has(g.text.toLowerCase())) {
            existing.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2), text: g.text, done: false, queued: false });
            existingTexts.add(g.text.toLowerCase());
            added = true;
          }
        });
        if (added) App.goals.set(active, existing);
      }
    },

    stats(date) {
      const list = App.goals.get(date);
      return { total: list.length, done: list.filter(g => g.done).length, list };
    },
  };

  /* ============================================================
     PHASE 2 — STREAK
  ============================================================ */

  App.streak = {
    get() { return App.storage.get('goal_streak_v1', { count: 0, lastProcessedDate: null }); },
    save(s) { App.storage.set('goal_streak_v1', s); },

    processDay(date) {
      const stats = App.goals.stats(date);
      if (!stats.total) return; // no goals = skip
      const s = App.streak.get();
      if (s.lastProcessedDate === date) return; // already counted

      if (stats.done === stats.total) {
        // Check if this date is consecutive with last processed
        const prev = s.lastProcessedDate;
        if (!prev || App.dates.daysBetween(prev, date) === 1) {
          s.count = (s.count || 0) + 1;
        } else {
          s.count = 1;
        }
        s.lastProcessedDate = date;
        App.streak.save(s);
      }
    },

    current() {
      const s = App.streak.get();
      const active = App.dates.activeDate();
      // If streak was counted for today or yesterday, it's still live
      if (!s.lastProcessedDate) return s.count;
      const diff = App.dates.daysBetween(s.lastProcessedDate, active);
      if (diff > 1) {
        // Check if yesterday had incomplete goals (streak broken)
        const yesterday = App.dates.addDays(active, -1);
        const yStats = App.goals.stats(yesterday);
        if (yStats.total > 0 && yStats.done < yStats.total) {
          App.streak.save({ count: 0, lastProcessedDate: null });
          return 0;
        }
      }
      return s.count;
    },
  };

  /* ============================================================
     PHASE 2 — GOAL TICKER
  ============================================================ */

  App.goalTicker = (function () {
    let idx = 0;
    let intervalId = null;
    let el = null;

    function getPending() {
      const { list } = App.goals.stats(App.dates.activeDate());
      return list.filter(g => !g.done);
    }

    function render() {
      if (!el) return;
      const pending = getPending();
      const { total, done } = App.goals.stats(App.dates.activeDate());

      const pill = el.querySelector('.ticker-pill');
      if (pill) pill.textContent = `${done}/${total}`;

      const viewport = el.querySelector('.ticker-viewport');
      if (!viewport) return;

      let text;
      if (total === 0) {
        text = 'No goals set for today';
      } else if (pending.length === 0) {
        text = '✓ All goals done — solid day.';
      } else {
        if (idx >= pending.length) idx = 0;
        text = pending[idx].text;
      }

      // Slide out existing, slide in new
      const existing = viewport.querySelector('.ticker-item');
      if (existing) {
        existing.classList.add('out');
        setTimeout(() => existing.remove(), 350);
      }
      setTimeout(() => {
        const item = document.createElement('div');
        item.className = 'ticker-item';
        item.textContent = text;
        viewport.appendChild(item);
      }, 350);
    }

    function advance() {
      const pending = getPending();
      if (pending.length > 1) idx = (idx + 1) % pending.length;
      render();
    }

    function init() {
      el = document.getElementById('goal-ticker');
      if (!el) return;
      el.innerHTML = `
        <div class="ticker-wrap">
          <span class="ticker-led"></span>
          <span class="ticker-label">GOALS</span>
          <div class="ticker-viewport"></div>
          <span class="ticker-pill">0/0</span>
        </div>`;
      render();
      if (intervalId) clearInterval(intervalId);
      intervalId = setInterval(advance, 5000);
      App.bus.on('goals-changed', () => { idx = 0; render(); });
    }

    return { init };
  })();

  /* ============================================================
     PHASE 2 — DAY RING
  ============================================================ */

  App.dayRing = (function () {
    const R = 70;
    const C = 2 * Math.PI * R; // ≈ 439.82

    const PHASES = [
      { label: 'SLEEPING',   start: 0,  end: 8,  color: '#4A4A6A' },
      { label: 'MORNING',    start: 8,  end: 12, color: '#F2C063' },
      { label: 'MIDDAY',     start: 12, end: 15, color: '#FFA040' },
      { label: 'AFTERNOON',  start: 15, end: 19, color: '#FF7060' },
      { label: 'EVENING',    start: 19, end: 22, color: '#9B70FF' },
      { label: 'BEDTIME',    start: 22, end: 24, color: '#5070FF' },
    ];

    function getPhaseInfo(h, m) {
      const frac = h + m / 60;
      if (frac >= 24) return { ...PHASES[5], progress: 1 };
      if (frac < 0)   return { ...PHASES[0], progress: 0 };
      const phase = PHASES.find(p => frac >= p.start && frac < p.end) || PHASES[5];
      const progress = Math.min(1, Math.max(0, (frac - 8) / 16)); // 8AM–midnight = 100%
      return { ...phase, progress };
    }

    function formatTime(d) {
      const h = d.getHours(), m = d.getMinutes();
      const ampm = h >= 12 ? 'PM' : 'AM';
      const hh = h % 12 || 12;
      return `${hh}:${String(m).padStart(2, '0')} ${ampm}`;
    }

    function minutesUntilMidnight(d) {
      return (23 - d.getHours()) * 60 + (59 - d.getMinutes());
    }

    function render() {
      const now = new Date();
      const h = now.getHours(), m = now.getMinutes();
      const { label, color, progress } = getPhaseInfo(h, m);

      const arc = document.getElementById('ring-fg');
      if (arc) {
        arc.style.stroke = color;
        arc.style.strokeDasharray = C;
        arc.style.strokeDashoffset = C * (1 - progress);
      }

      const pctEl = document.getElementById('ring-pct');
      if (pctEl) pctEl.textContent = Math.round(progress * 100) + '%';

      const phaseEl = document.getElementById('ring-phase-label');
      if (phaseEl) phaseEl.textContent = label;

      const clockEl = document.getElementById('ring-clock');
      if (clockEl) clockEl.textContent = formatTime(now);

      const statusEl = document.getElementById('ring-status');
      if (statusEl) {
        if (h < 8) statusEl.textContent = 'Still early — rest up.';
        else if (h >= 24 || (h === 0)) statusEl.textContent = 'Past bedtime! Get some sleep.';
        else statusEl.textContent = 'Day is underway.';
      }

      const remEl = document.getElementById('ring-remaining');
      if (remEl) {
        if (h < 8) {
          const until8 = (8 - h) * 60 - m;
          remEl.textContent = `${Math.floor(until8 / 60)}h ${until8 % 60}m until 8AM`;
        } else if (h < 24) {
          const rem = minutesUntilMidnight(now);
          remEl.textContent = `${Math.floor(rem / 60)}h ${rem % 60}m remaining`;
        } else {
          remEl.textContent = 'Day complete';
        }
      }

      const hoursEl = document.getElementById('ring-hours');
      if (hoursEl) hoursEl.textContent = '8:00 AM → 12:00 AM';
    }

    function init() {
      const el = document.getElementById('day-ring');
      if (!el) return;
      el.className = 'card';
      el.innerHTML = `
        <div class="ring-card">
          <div class="ring-svg-wrap">
            <svg viewBox="0 0 160 160" width="160" height="160">
              <circle class="ring-bg-circle" cx="80" cy="80" r="${R}" />
              <circle id="ring-fg" class="ring-fg-circle" cx="80" cy="80" r="${R}"
                      transform="rotate(-90 80 80)"
                      style="stroke-dasharray:${C};stroke-dashoffset:${C}" />
            </svg>
            <div class="ring-center">
              <span class="ring-pct" id="ring-pct">0%</span>
              <span class="ring-phase-label" id="ring-phase-label">SLEEPING</span>
              <span class="ring-clock" id="ring-clock">--:--</span>
            </div>
          </div>
          <div class="ring-info">
            <div class="ring-status" id="ring-status"></div>
            <div class="ring-remaining" id="ring-remaining"></div>
            <div class="ring-hours" id="ring-hours"></div>
          </div>
        </div>`;
      render();
      setInterval(render, 60000);
    }

    return { init };
  })();

  /* ============================================================
     PHASE 2 — TODO LIST (shared renderer)
  ============================================================ */

  App.todoList = (function () {
    function makeTodoCard(date, opts) {
      const { isTomorrow } = opts || {};
      const el = document.getElementById(isTomorrow ? 'todo-tomorrow' : 'todo-today');
      if (!el) return;

      const active = App.dates.activeDate();
      const isReadOnly = isTomorrow; // tomorrow is read-only until it becomes today

      function getDateLabel(d) {
        const today = App.dates.today();
        const tomorrow = App.dates.addDays(today, 1);
        if (d === today) return 'TODAY';
        if (d === tomorrow) return 'TOMORROW';
        return d;
      }

      function renderCard() {
        const { total, done, list } = App.goals.stats(date);
        const streak = App.streak.current();
        const VISIBLE_LIMIT = 5;
        const isExpanded = el._expanded || false;
        const visibleList = isExpanded ? list : list.slice(0, VISIBLE_LIMIT);

        const eyebrow = isTomorrow
          ? `<span class="todo-section-label">To Do List — Plan Tomorrow <span class="planned-badge">${total} planned</span></span>`
          : `<div class="todo-eyebrow">${getDateLabel(date)}</div>`;

        const allDone = total > 0 && done === total;
        const progressSegs = list.map((g, i) =>
          `<div class="progress-seg ${g.done ? 'done' : ''}"></div>`).join('');

        const rowsHtml = visibleList.map((g, i) => {
          const realIdx = list.indexOf(g);
          return `<div class="goal-row ${g.done ? 'is-done' : ''} ${g.queued && !g.done ? 'is-queued' : ''}"
                       data-id="${g.id}" data-idx="${realIdx}"
                       draggable="true">
            <div class="goal-check ${g.done ? 'checked' : ''}" data-action="toggle" data-id="${g.id}"></div>
            <div class="goal-text-wrap">
              <span class="goal-text" data-action="edit" data-id="${g.id}">${escHtml(g.text)}</span>
            </div>
            <div class="goal-actions">
              ${!isReadOnly && !g.done ? `<button class="goal-btn queue-btn" data-action="queue" data-id="${g.id}" title="Queue for later">⚡</button>` : ''}
              <button class="goal-btn del-btn" data-action="delete" data-id="${g.id}" title="Delete">×</button>
            </div>
          </div>`;
        }).join('');

        const showMoreBtn = !isExpanded && list.length > VISIBLE_LIMIT
          ? `<button class="show-more-btn" data-action="expand">Show ${list.length - VISIBLE_LIMIT} more</button>`
          : (isExpanded && list.length > VISIBLE_LIMIT
            ? `<button class="show-more-btn" data-action="collapse">Show less</button>` : '');

        const addRow = !isReadOnly ? `
          <div class="todo-add-row">
            <input class="todo-add-input" placeholder="Add a goal…" id="${isTomorrow ? 'tmrw-add' : 'today-add'}" />
            <button class="todo-add-btn" data-action="add">Add</button>
            <button class="todo-add-btn polish" data-action="polish" title="Polish with AI">✨</button>
          </div>` : '';

        const pushBtn = !isReadOnly && total > done && total > 0
          ? `<button class="push-btn" data-action="push">→ Push remaining to tomorrow</button>`
          : '';

        el.className = 'card';
        el.innerHTML = `
          <div class="todo-header">
            <div>
              ${eyebrow}
              ${!isTomorrow ? `<div class="todo-big-progress">
                <span>${done}</span><span class="todo-total">/${total}</span>
              </div>
              <div class="todo-done-label">${allDone ? '✓ all done — solid day.' : ''}</div>` : ''}
            </div>
            ${!isTomorrow ? `<div class="streak-pill ${streak === 0 ? 'zero' : ''}">⚡ ${streak} day${streak !== 1 ? 's' : ''}</div>` : ''}
          </div>
          ${list.length > 0 ? `<div class="progress-bar">${progressSegs}</div>` : ''}
          <div class="goal-list">${rowsHtml}</div>
          ${showMoreBtn}
          ${addRow}
          ${pushBtn}`;

        attachEvents(el, date, isReadOnly, renderCard);
      }

      el._render = renderCard;
      renderCard();
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function attachEvents(el, date, isReadOnly, renderCard) {
      let dragSrcIdx = null;

      el.addEventListener('click', function (e) {
        const action = e.target.closest('[data-action]');
        if (!action) return;
        const act = action.dataset.action;
        const id = action.dataset.id;

        if (act === 'toggle') { App.goals.toggle(date, id); return; }
        if (act === 'delete') { App.goals.delete(date, id); return; }
        if (act === 'queue')  { App.goals.toggleQueue(date, id); return; }
        if (act === 'add')    {
          const inp = el.querySelector('.todo-add-input');
          if (inp && inp.value.trim()) { App.goals.add(date, inp.value); inp.value = ''; inp.focus(); }
          return;
        }
        if (act === 'polish') {
          const inp = el.querySelector('.todo-add-input');
          if (inp && inp.value.trim() && typeof App.ai !== 'undefined') {
            App.ai.polishGoal(inp.value).then(t => { inp.value = t; }).catch(() => {});
          }
          return;
        }
        if (act === 'push') {
          const tomorrow = App.dates.addDays(App.dates.today(), 1);
          App.goals.pushRemaining(date, tomorrow);
          return;
        }
        if (act === 'expand') { el._expanded = true; renderCard(); return; }
        if (act === 'collapse') { el._expanded = false; renderCard(); return; }
        if (act === 'edit') {
          const row = action.closest('.goal-row');
          const span = row && row.querySelector('.goal-text');
          if (!span) return;
          const id = action.dataset.id;
          const originalText = App.goals.get(date).find(g => g.id === id)?.text || '';
          const input = document.createElement('input');
          input.className = 'goal-text-input';
          input.value = originalText;
          span.replaceWith(input);
          input.focus();
          input.select();
          function commit() {
            const newText = input.value.trim();
            if (newText && newText !== originalText) App.goals.updateText(date, id, newText);
            else renderCard();
          }
          input.addEventListener('blur', commit);
          input.addEventListener('keydown', e => {
            if (e.key === 'Enter') commit();
            if (e.key === 'Escape') renderCard();
          });
        }
      });

      el.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          const inp = e.target.closest('.todo-add-input');
          if (inp && inp.value.trim()) { App.goals.add(date, inp.value); inp.value = ''; }
        }
      });

      // Drag and drop for reorder
      el.addEventListener('dragstart', function (e) {
        const row = e.target.closest('.goal-row');
        if (!row) return;
        dragSrcIdx = parseInt(row.dataset.idx, 10);
        row.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      el.addEventListener('dragend', function (e) {
        el.querySelectorAll('.goal-row').forEach(r => r.classList.remove('dragging', 'drag-over'));
      });
      el.addEventListener('dragover', function (e) {
        const row = e.target.closest('.goal-row');
        if (!row) return;
        e.preventDefault();
        el.querySelectorAll('.goal-row').forEach(r => r.classList.remove('drag-over'));
        row.classList.add('drag-over');
      });
      el.addEventListener('drop', function (e) {
        e.preventDefault();
        const row = e.target.closest('.goal-row');
        if (!row || dragSrcIdx === null) return;
        const toIdx = parseInt(row.dataset.idx, 10);
        if (!isNaN(toIdx)) App.goals.reorder(date, dragSrcIdx, toIdx);
        dragSrcIdx = null;
      });
    }

    function init() {
      const active = App.dates.activeDate();
      const tomorrow = App.dates.addDays(App.dates.today(), 1);
      makeTodoCard(active, { isTomorrow: false });
      makeTodoCard(tomorrow, { isTomorrow: true });

      App.bus.on('goals-changed', ({ date }) => {
        const todayEl = document.getElementById('todo-today');
        const tmrwEl  = document.getElementById('todo-tomorrow');
        if (todayEl && todayEl._render) todayEl._render();
        if (tmrwEl  && tmrwEl._render)  tmrwEl._render();
      });
    }

    return { init };
  })();

          { label: 'Inconsistent',    icon: '⚡' }, { label: 'Pretty Solid',    icon: '💪' },
          { label: 'Full Grind Mode', icon: '🔥' },
        ]},
      { id: 'wakeTime', type: 'cards', question: "What time do you usually wake up?", cols: 2,
        options: [
          { label: 'Before 6AM', icon: '🌙' }, { label: '6–7AM', icon: '🌅' },
          { label: '7–8AM',      icon: '☀️' }, { label: '8–9AM', icon: '🌤️' },
          { label: 'After 9AM',  icon: '😴' },
        ]},
      { id: 'fitnessLevel', type: 'cards', question: "What's your current fitness level?", cols: 2,
        options: [
          { label: 'Couch mode',       icon: '🛋️' }, { label: 'Light activity',   icon: '🚶' },
          { label: 'Regular workouts', icon: '🏃' }, { label: 'Athletic',         icon: '💪' },
          { label: 'Beast mode',       icon: '🦁' },
        ]},
      { id: 'obstacle', type: 'cards', question: "What's your biggest obstacle?", cols: 3,
        options: [
          { label: 'Laziness',                  icon: '😪' }, { label: 'No time',        icon: '⏰' },
          { label: 'No motivation',             icon: '😑' }, { label: "Don't know where to start", icon: '🤷' },
          { label: 'Distraction',               icon: '📱' }, { label: 'All of the above', icon: '💀' },
        ]},
      { id: 'bestSelf', type: 'text', question: "One sentence: what does your best self look like?", placeholder: 'Describe your best self…' },
      { id: 'welcome', type: 'welcome' },
    ];

    const QUOTES = [
      "Every expert was once a beginner. Your consistency today builds your legacy tomorrow.",
      "You don't rise to the level of your goals — you fall to the level of your systems. Let's build yours.",
      "Small daily improvements are the key to staggering long-term results.",
      "The secret of getting ahead is getting started. You just did.",
    ];

    let answers = {}, step = 0;

    function dots(cur, total) {
      return '<div class="modal-dots">' +
        Array.from({ length: total }, (_, i) =>
          `<div class="modal-dot ${i < cur ? 'done' : i === cur ? 'active' : ''}"></div>`
        ).join('') + '</div>';
    }

    function renderStep() {
      const s = STEPS[step];

      if (s.type === 'welcome') {
        const name = answers.name || 'there';
        const focus = answers.focus || 'your goals';
        const quote = QUOTES[Math.floor(Math.random() * QUOTES.length)];
        App.modal.open(`
          ${dots(step, STEPS.length)}
          <div class="modal-welcome">
            <div class="modal-welcome-name">Hey, ${name}! 👋</div>
            <div class="modal-welcome-focus">Focus: ${focus}</div>
            <div class="modal-welcome-quote">"${quote}"</div>
            <button class="modal-btn primary" id="ob-finish" style="width:100%">Let's build your first day →</button>
          </div>`);
        document.getElementById('ob-finish').addEventListener('click', finish);

      }

      const sel = answers[s.id];
      let bodyHtml = '';
      if (s.type === 'text') {
        bodyHtml = `<input class="modal-text-input" id="ob-text" placeholder="${s.placeholder}" value="${sel || ''}" />`;
      } else {
        const gridCls = s.cols === 3 ? 'choice-grid cols-3' : 'choice-grid';
        bodyHtml = `<div class="${gridCls}">` +
          s.options.map(o =>
            `<div class="choice-card ${sel === o.label ? 'selected' : ''}" data-value="${o.label}">
               <span class="choice-icon">${o.icon}</span>
               <span class="choice-label">${o.label}</span>
             </div>`).join('') + '</div>';
      }

      App.modal.open(`
        ${dots(step, STEPS.length)}
        <h2 class="modal-question">${s.question}</h2>
        ${bodyHtml}
        <div class="modal-nav">
          ${step > 0 ? '<button class="modal-btn secondary" id="ob-back">← Back</button>' : ''}
          <button class="modal-btn primary" id="ob-next" ${s.type === 'cards' && !sel ? 'disabled' : ''}>
            ${step === STEPS.length - 2 ? 'Finish →' : 'Next →'}
          </button>
        </div>`);

      document.querySelectorAll('.choice-card').forEach(c => {
        c.addEventListener('click', function () {
          answers[s.id] = this.dataset.value;
          document.querySelectorAll('.choice-card').forEach(x => x.classList.remove('selected'));
          this.classList.add('selected');
          document.getElementById('ob-next').disabled = false;
          setTimeout(goNext, 300);
        });
      });

      const ti = document.getElementById('ob-text');
      if (ti) {
        ti.focus();
        ti.addEventListener('keydown', e => { if (e.key === 'Enter' && ti.value.trim()) { answers[s.id] = ti.value.trim(); goNext(); } });
      }
      document.getElementById('ob-next').addEventListener('click', () => {

      const bb = document.getElementById('ob-back');
      if (bb) bb.addEventListener('click', () => { step--; renderStep(); });

      App.storage.set('user_profile', answers);
      App.modal.close();
      setTimeout(() => App.checkin.maybeShow(), 800);

  /* ============================================================
     PHASE 3 — MORNING CHECK-IN
  ============================================================ */

  App.checkin = (function () {
    const SLEEP_OPTS    = [{ label:'Terrible',icon:'💀',val:1},{label:'Poor',icon:'😴',val:2},{label:'Okay',icon:'😐',val:3},{label:'Good',icon:'😌',val:4},{label:'Great',icon:'🌟',val:5}];
    const ENERGY_OPTS   = [{ label:'Empty',icon:'⚡0',val:0},{label:'Low',icon:'⚡1',val:1},{label:'Medium',icon:'⚡2',val:2},{label:'High',icon:'⚡3',val:3},{label:'Turbo',icon:'⚡4',val:4}];
    const STRESS_OPTS   = [{ label:'Chilling',icon:'😎',val:1},{label:'A little tense',icon:'😬',val:2},{label:'Moderate stress',icon:'😰',val:3},{label:'High stress',icon:'😱',val:4}];
    const INTENTION_OPTS= [{ label:'Grind day',icon:'💼'},{label:'Learn something new',icon:'📚'},{label:'Take it easy',icon:'🌿'},{label:'Work out hard',icon:'💪'},{label:'Catch up on tasks',icon:'📋'}];
    const EMOJIS = ['😞','😕','😐','🙂','😊','😄'];
    const TOTAL = 6;
    let answers = {}, step = 0;

    function dots(cur) {
      return '<div class="modal-dots">' +
        Array.from({ length: TOTAL }, (_, i) =>
          `<div class="modal-dot ${i < cur ? 'done' : i === cur ? 'active' : ''}"></div>`
        ).join('') + '</div>';
    }

    function cardGrid(opts, key) {
      const sel = answers[key];
      return '<div class="choice-grid">' +
        opts.map(o =>
          `<div class="choice-card ${sel === o.val || sel === o.label ? 'selected' : ''}"
                data-key="${key}" data-val="${o.val !== undefined ? o.val : o.label}">
             <span class="choice-icon">${o.icon}</span>
             <span class="choice-label">${o.label}</span>
           </div>`).join('') + '</div>';
    }

    function pick(key, cb) {
      document.querySelectorAll(`.choice-card[data-key="${key}"]`).forEach(c => {
        c.addEventListener('click', function () {
          const raw = this.dataset.val;
          answers[key] = isNaN(raw) ? raw : Number(raw);
          document.querySelectorAll(`.choice-card[data-key="${key}"]`).forEach(x => x.classList.remove('selected'));
          this.classList.add('selected');
          const nb = document.getElementById('ci-next'); if (nb) nb.disabled = false;
          setTimeout(cb, 280);
        });
      });
    }

    function navBtns(showBack, nextLabel, nextDisabled) {
      return `<div class="modal-nav">
        ${showBack ? '<button class="modal-btn secondary" id="ci-back">← Back</button>' : ''}
        <button class="modal-btn primary" id="ci-next" ${nextDisabled ? 'disabled' : ''}>${nextLabel || 'Next →'}</button>
      </div>`;
    }

    function wire() {
      const nb = document.getElementById('ci-next');
      const bb = document.getElementById('ci-back');
      if (nb) nb.addEventListener('click', goNext);
      if (bb) bb.addEventListener('click', goPrev);
    }

    function morningMsg() {
      const profile = App.storage.get('user_profile', {});
      const mood = answers.mood || 3;
      const name = profile.name || 'there';
      const intention = answers.customIntention || answers.intention || 'do your best';
      if (mood <= 2) return `Hey ${name}, rough start — that's okay. Even on your hardest days, showing up matters. One small win today. Just one.`;
      if (mood <= 4) return `Good morning ${name}. Your intention: <strong>${intention}</strong>. Take it one task at a time — progress over perfection.`;
      return `Let's go ${name}! You're in a great headspace. Intention: <strong>${intention}</strong>. Use this energy — make today count.`;
    }

    function renderStep() {
      const profile = App.storage.get('user_profile', {});
      const name = profile.name || '';

      if (step === 0) {
        App.modal.open(`
          ${dots(0)}
          <h2 class="modal-question">Good morning${name ? ' ' + name : ''} ☀️</h2>

          <div class="emoji-row">${EMOJIS.map((e,i) =>

          ).join('')}</div>

            const nb = document.getElementById('ci-next'); if (nb) nb.disabled = false;
            setTimeout(goNext, 280);
          });

        wire();

      } else if (step === 1) {
        App.modal.open(`${dots(1)}<h2 class="modal-question">How was your sleep?</h2>${cardGrid(SLEEP_OPTS,'sleep')}${navBtns(true,'Next →',answers.sleep===undefined)}`);
        pick('sleep', goNext); wire();

      } else if (step === 2) {
        App.modal.open(`${dots(2)}<h2 class="modal-question">Energy level right now?</h2>${cardGrid(ENERGY_OPTS,'energy')}${navBtns(true,'Next →',answers.energy===undefined)}`);
        pick('energy', goNext); wire();

      } else if (step === 3) {
        App.modal.open(`${dots(3)}<h2 class="modal-question">Any stress or anxiety?</h2>${cardGrid(STRESS_OPTS,'stress')}${navBtns(true,'Next →',answers.stress===undefined)}`);
        pick('stress', goNext); wire();

      } else if (step === 4) {
        const selInt = answers.intention;
        App.modal.open(`
          ${dots(4)}
          <h2 class="modal-question">Set your intention for today</h2>
          <div class="choice-grid">${INTENTION_OPTS.map(o =>
            `<div class="choice-card ${selInt===o.label?'selected':''}" data-key="intention" data-val="${o.label}">
               <span class="choice-icon">${o.icon}</span><span class="choice-label">${o.label}</span>
             </div>`).join('')}</div>
          <input class="custom-intention-input" id="ci-custom" placeholder="Or write your own…" value="${answers.customIntention||''}" />
          ${navBtns(true, 'Next →', false)}`);
        pick('intention', () => {});
        document.getElementById('ci-custom').addEventListener('input', function () {
          if (this.value.trim()) { answers.customIntention = this.value.trim(); answers.intention = undefined;
            document.querySelectorAll('.choice-card[data-key="intention"]').forEach(x => x.classList.remove('selected')); }
        });
        wire();

      } else if (step === 5) {
        App.modal.open(`
          ${dots(5)}
          <h2 class="modal-question">Here's your morning brief ✨</h2>
          <div class="modal-morning-msg">${morningMsg()}</div>
          <div class="modal-nav">
            <button class="modal-btn secondary" id="ci-back">← Back</button>
            <button class="modal-btn primary" id="ci-finish" style="flex:1">Start your day →</button>
          </div>`);
        document.getElementById('ci-finish').addEventListener('click', finish);
        document.getElementById('ci-back').addEventListener('click', goPrev);
      }
    }

    function goNext() { step++; renderStep(); }
    function goPrev() { step--; renderStep(); }

    function finish() {
      App.storage.set(`checkin:${App.dates.activeDate()}`, { ...answers, ts: Date.now() });
      App.modal.close();
      App.bus.emit('checkin-completed', answers);
    }

    return {
      maybeShow() {
        if (!App.storage.get('user_profile', null)) return;
        if (App.storage.get(`checkin:${App.dates.activeDate()}`, null)) return;
        setTimeout(() => { step = 0; answers = {}; renderStep(); }, 5000);
      },
    };
  })();

  /* ============================================================
     PHASE 3 — INIT REGISTRATION
  ============================================================ */

  App.registerInit(function () {
    App.onboarding.maybeShow();
    App.checkin.maybeShow();
  });

  /* ============================================================
     PHASE 4 — WASTED TIME LOGGER
  ============================================================ */

  App.timeLog = (function () {
    function key(date) { return `timelog:${date}`; }
    function get(date) { return App.storage.get(key(date), []); }
    function add(date, entry) {
      const list = get(date);
      list.push({ ...entry, id: Date.now().toString(36), loggedAt: Date.now() });
      App.storage.set(key(date), list);
    }

    function opportunityCost(hours) {
      const h = parseFloat(hours) || 0;
      if (h <= 1)  return 'finished 2 chapters of a book or completed a full workout';
      if (h <= 2)  return 'learned a new concept or built a small side project';
      if (h <= 4)  return 'built a feature, studied for an exam, or practiced an instrument for a session';
      if (h <= 6)  return 'read an entire short book or hit a significant project milestone';
      if (h <= 10) return 'shipped a full feature, read an entire book, or run a half marathon';
      return 'built an MVP, completed a course, or transformed a physical habit';
    }

    function weeklyTotal() {
      let total = 0;
      for (let i = 0; i < 7; i++) {
        const d = App.dates.addDays(App.dates.activeDate(), -i);
        get(d).forEach(e => { total += parseFloat(e.hours) || 0; });
      }
      return total;
    }

    function last7Entries() {
      const entries = [];
      for (let i = 0; i < 7; i++) {
        const d = App.dates.addDays(App.dates.activeDate(), -i);
        get(d).forEach(e => entries.push({ ...e, date: d }));
      }
      return entries.sort((a, b) => b.loggedAt - a.loggedAt).slice(0, 20);
    }

    function render() {
      const el = document.getElementById('time-log');
      if (!el) return;
      const entries = last7Entries();
      const wTotal = weeklyTotal();

      el.className = 'card';
      el.innerHTML = `
        <div class="section-eyebrow">Time Log</div>
        <div class="timelog-input-row">
          <input class="timelog-input" id="tl-activity" placeholder="What did you do?" />
          <input class="timelog-input" id="tl-hours" type="number" min="0.5" max="24" step="0.5" placeholder="hrs" />
          <select class="timelog-select" id="tl-cat">
            <option value="Gaming">Gaming</option>
            <option value="Social Media">Social Media</option>
            <option value="TV/Netflix">TV/Netflix</option>
            <option value="Other">Other</option>
          </select>
          <button class="timelog-log-btn" id="tl-log">Log it</button>
        </div>
        <div id="tl-opp-card"></div>
        <div class="timelog-history">${
          entries.length
            ? entries.map(e =>
                `<span class="timelog-chip">${e.activity} · ${e.hours}h<span class="chip-cat">${e.category}</span></span>`
              ).join('')
            : '<span style="font-size:12px;color:var(--text-tertiary)">No entries yet</span>'
        }</div>
        <div class="timelog-weekly">This week: ${wTotal.toFixed(1)}h logged</div>`;

      document.getElementById('tl-log').addEventListener('click', logEntry);
      document.getElementById('tl-activity').addEventListener('keydown', e => { if (e.key === 'Enter') logEntry(); });

      function logEntry() {
        const activity = document.getElementById('tl-activity').value.trim();
        const hours    = parseFloat(document.getElementById('tl-hours').value) || 0;
        const category = document.getElementById('tl-cat').value;
        if (!activity || hours <= 0) return;
        add(App.dates.activeDate(), { activity, hours, category });
        const opp = opportunityCost(hours);
        document.getElementById('tl-opp-card').innerHTML = `
          <div class="opp-card">
            You spent <strong>${hours}h</strong> on ${activity}. Next time you have ${hours}h free, you could've <strong>${opp}</strong>. No guilt — just something to think about.
          </div>`;
        document.getElementById('tl-activity').value = '';
        document.getElementById('tl-hours').value = '';
        render();
      }
    }

    return { init() { render(); } };
  })();

  /* ============================================================
     PHASE 4 — FITNESS TRACKER
  ============================================================ */

  App.fitness = (function () {
    function key(date) { return `fitness:${date}`; }
    function get(date) { return App.storage.get(key(date), []); }
    function getPlan() { return App.storage.get('fitness_plan', null); }

    function weeklyStats() {
      let workouts = 0, minutes = 0;
      for (let i = 0; i < 7; i++) {
        const d = App.dates.addDays(App.dates.activeDate(), -i);
        const entries = get(d);
        workouts += entries.length;
        entries.forEach(e => { minutes += parseInt(e.duration) || 0; });
      }
      return { workouts, minutes };
    }

    let activeTab = 'log';
    let intensity = 0;

    function renderLog(el) {
      const stats = weeklyStats();
      el.innerHTML = `
        <div class="fitness-log-grid">
          <select class="fitness-select" id="fit-type">
            <option value="strength">Strength</option>
            <option value="cardio">Cardio</option>
            <option value="flexibility">Flexibility</option>
            <option value="sport">Sport</option>
          </select>
          <input class="fitness-input" id="fit-dur" type="number" min="1" max="300" placeholder="Duration (min)" />
        </div>
        <textarea class="fitness-notes" id="fit-notes" rows="2" placeholder="Notes (optional)…"></textarea>
        <div class="stars-row">
          <span class="star-label">Intensity:</span>
          ${[1,2,3,4,5].map(n =>
            `<button class="star-btn ${n <= intensity ? 'lit' : ''}" data-star="${n}">★</button>`
          ).join('')}
        </div>
        <button class="fitness-save-btn" id="fit-save">Save workout</button>
        <div class="fitness-summary">
          <div class="fitness-stat"><div class="fitness-stat-val">${stats.workouts}</div><div class="fitness-stat-label">WORKOUTS</div></div>
          <div class="fitness-stat"><div class="fitness-stat-val">${stats.minutes}</div><div class="fitness-stat-label">MINUTES</div></div>
        </div>`;

      el.querySelectorAll('.star-btn').forEach(btn => {
        btn.addEventListener('click', function () {
          intensity = parseInt(this.dataset.star, 10);
          el.querySelectorAll('.star-btn').forEach((b, i) => b.classList.toggle('lit', i < intensity));
        });
      });

      document.getElementById('fit-save').addEventListener('click', () => {
        const type     = document.getElementById('fit-type').value;
        const duration = parseInt(document.getElementById('fit-dur').value) || 0;
        const notes    = document.getElementById('fit-notes').value.trim();
        if (!duration) return;
        const list = get(App.dates.activeDate());
        list.push({ type, duration, intensity, notes, ts: Date.now() });
        App.storage.set(key(App.dates.activeDate()), list);
        intensity = 0;
        document.getElementById('fit-dur').value = '';
        document.getElementById('fit-notes').value = '';
        render();
      });
    }

    function renderPlan(el) {
      const plan = getPlan();
      if (!plan) {
        el.innerHTML = `
          <div class="plan-placeholder">
            <div>No plan yet. Generate a personalised 7-day plan based on your profile.</div>
            <button class="plan-generate-btn" id="fit-gen">✨ Generate My Plan</button>
          </div>`;
        document.getElementById('fit-gen').addEventListener('click', () => {
          if (typeof App.ai !== 'undefined') {
            document.getElementById('fit-gen').textContent = 'Generating…';
            document.getElementById('fit-gen').disabled = true;
            App.ai.generateFitnessPlan().then(() => render()).catch(() => render());
          } else {
            el.innerHTML = `<div class="plan-placeholder" style="color:var(--text-tertiary)">Add your API key to generate a personalised plan.</div>`;
          }
        });
        return;
      }
      el.innerHTML = `<div class="plan-day-cards">${
        plan.days.map((day, i) => {
          const done = plan.doneDays && plan.doneDays[i];
          return `<div class="plan-day-card">
            <div class="plan-day-name">${day.name || 'Day ' + (i+1)}</div>
            <div class="plan-day-meta">${day.duration || ''}</div>
            <div class="plan-day-exercises">${(day.exercises || []).join(' · ') || day.description || ''}</div>
            <button class="plan-done-btn ${done ? 'done' : ''}" data-day="${i}">${done ? '✓ Done' : 'Mark done'}</button>
          </div>`;
        }).join('')
      }</div>`;
      el.querySelectorAll('.plan-done-btn').forEach(btn => {
        btn.addEventListener('click', function () {
          const p = getPlan();
          if (!p.doneDays) p.doneDays = {};
          p.doneDays[this.dataset.day] = !p.doneDays[this.dataset.day];
          App.storage.set('fitness_plan', p);
          renderPlan(el);
        });
      });
    }

    function render() {
      const el = document.getElementById('fitness');
      if (!el) return;
      el.className = 'card';
      el.innerHTML = `
        <div class="section-eyebrow">Fitness</div>
        <div class="tab-bar">
          <button class="tab-btn ${activeTab==='log'?'active':''}" data-tab="log">Log Workout</button>
          <button class="tab-btn ${activeTab==='plan'?'active':''}" data-tab="plan">My Plan</button>
        </div>
        <div id="fit-body"></div>`;

      el.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', function () { activeTab = this.dataset.tab; render(); });
      });

      const body = document.getElementById('fit-body');
      if (activeTab === 'log') renderLog(body);
      else renderPlan(body);
    }

    return { init() { render(); } };
  })();

  /* ============================================================
     PHASE 4 — MENTAL HEALTH PANEL
  ============================================================ */

  App.mentalHealth = (function () {
    const EMOJIS = ['😞','😕','😐','🙂','😊','😄'];
    const STRESS_TAGS = ['calm','okay','tense','overwhelmed'];
    const PROMPTS = {
      1: "What's weighing on you most right now? Just let it out.",
      2: "It's okay to not be okay. What's one small thing that would help?",
      3: "What's one thing you can do today to move the needle, even slightly?",
      4: "You're doing alright. What would make today feel like a win?",
      5: "Good energy! What are you most looking forward to?",
      6: "You're in a great headspace — what do you want to create today?",
    };

    function key(date) { return `mental:${date}`; }
    function get(date) { return App.storage.get(key(date), {}); }
    function save(date, data) { App.storage.set(key(date), { ...get(date), ...data }); }

    function render() {
      const el = document.getElementById('mental-health');
      if (!el) return;
      const active = App.dates.activeDate();
      const today  = get(active);
      const mood   = today.mood || 0;
      const prompt = PROMPTS[mood] || PROMPTS[3];

      // Past 7 days history dots
      const histDots = Array.from({ length: 7 }, (_, i) => {
        const d = App.dates.addDays(active, -(6 - i));
        const m = get(d).mood || 0;
        const label = d.slice(5).replace('-', '/');
        return `<div class="mh-dot-wrap">
          <div class="mh-dot ${m ? 'm' + m : ''}"></div>
          <div class="mh-dot-date">${label}</div>
        </div>`;
      }).join('');

      el.className = 'card';
      el.innerHTML = `
        <div class="section-eyebrow">Mental Health</div>
        <div class="mh-history-row">${histDots}</div>
        <div class="mh-mood-row">
          ${EMOJIS.map((e, i) =>
            `<button class="mh-emoji-btn ${mood === i+1 ? 'selected' : ''}" data-mood="${i+1}">${e}</button>`
          ).join('')}
        </div>
        <div class="mh-row">
          <span class="mh-row-label">Energy</span>
          <div class="dot-picker" id="mh-energy">
            ${[1,2,3,4,5].map(n =>
              `<button class="dot-pick-btn ${(today.energy||0) >= n ? 'lit' : ''}" data-val="${n}"></button>`
            ).join('')}
          </div>
        </div>
        <div class="mh-row">
          <span class="mh-row-label">Sleep</span>
          <div class="dot-picker" id="mh-sleep">
            ${[1,2,3,4,5].map(n =>
              `<button class="dot-pick-btn ${(today.sleep||0) >= n ? 'lit' : ''}" data-val="${n}"></button>`
            ).join('')}
          </div>
        </div>
        <div class="mh-row">
          <span class="mh-row-label">Stress</span>
          <div class="stress-tags">
            ${STRESS_TAGS.map(t =>
              `<button class="stress-tag ${today.stress === t ? 'selected' : ''}" data-stress="${t}">${t}</button>`
            ).join('')}
          </div>
        </div>
        <div class="mh-journal-prompt">${prompt}</div>
        <textarea class="mh-journal" id="mh-journal" placeholder="Write freely…">${today.journal || ''}</textarea>`;

      // Mood
      el.querySelectorAll('.mh-emoji-btn').forEach(btn => {
        btn.addEventListener('click', function () {
          save(active, { mood: parseInt(this.dataset.mood, 10) });
          App.bus.emit('mood-changed', { date: active });
          render();
        });
      });

      // Energy dots
      el.querySelectorAll('#mh-energy .dot-pick-btn').forEach(btn => {
        btn.addEventListener('click', function () {
          save(active, { energy: parseInt(this.dataset.val, 10) });
          el.querySelectorAll('#mh-energy .dot-pick-btn').forEach((b, i) =>
            b.classList.toggle('lit', i < parseInt(this.dataset.val, 10)));
        });
      });

      // Sleep dots
      el.querySelectorAll('#mh-sleep .dot-pick-btn').forEach(btn => {
        btn.addEventListener('click', function () {
          save(active, { sleep: parseInt(this.dataset.val, 10) });
          el.querySelectorAll('#mh-sleep .dot-pick-btn').forEach((b, i) =>
            b.classList.toggle('lit', i < parseInt(this.dataset.val, 10)));
        });
      });

      // Stress tags
      el.querySelectorAll('.stress-tag').forEach(tag => {
        tag.addEventListener('click', function () {
          save(active, { stress: this.dataset.stress });
          el.querySelectorAll('.stress-tag').forEach(t => t.classList.remove('selected'));
          this.classList.add('selected');
        });
      });

      // Journal — save on blur
      const journal = document.getElementById('mh-journal');
      if (journal) {
        journal.addEventListener('blur', function () {
          save(active, { journal: this.value });
        });
      }
    }

    return { init() { render(); App.bus.on('checkin-completed', () => render()); } };
  })();

  /* ============================================================
     PHASE 4 — INIT REGISTRATION
  ============================================================ */

  App.registerInit(function () {
    App.timeLog.init();
    App.fitness.init();
    App.mentalHealth.init();
  });

  /* ============================================================
     BOOT
  ============================================================ */

  App.boot = function () {
    const gear = document.getElementById('settings-gear');
    if (gear) {
      gear.addEventListener('click', function () {
        const ok = window.confirm('Reset all dashboard data? This cannot be undone.');
        if (ok) { App.storage.clearAll(); window.location.reload(); }
      });
    }
    for (const fn of App.initFns) { try { fn(); } catch (e) { console.error('[init]', e); } }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', App.boot);
  } else {
    App.boot();
  }
})();
</script>
</body>
</html>
